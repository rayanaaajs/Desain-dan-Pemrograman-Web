<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../assets/style.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <div class="search-box">
        <label for="search-input">Cari Data</label>
        <input
          type="text"
          id="search-input"
          placeholder="Ketik kata kunci..."
        />
        <button
          type="button"
          id="btn-reload"
          style="margin-left: 10px; padding: 0.5rem 1rem; cursor: pointer"
        >
          Muat Ulang
        </button>
      </div>
      <p id="loading-indicator" style="display: none">Memuat data...</p>
      <div class="table-responsive">
        <table>
          <thead>
            <tr>
              <th>Judul</th>
              <th>Pengarang</th>
              <th>Tahun</th>
              <th>Stok</th>
              <th>Kategori</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
    <script src="../assets/app.js"></script>
    <script src="../assets/buku.js"></script>
  </body>
</html>
